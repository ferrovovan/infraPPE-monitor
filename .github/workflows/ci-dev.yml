name: CI for dev

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  lint-only:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # --- Основная цель CI: проверка стиля ---
      - name: Install flake8
        run: pip install flake8

      - name: Lint with flake8
        run: flake8 source

