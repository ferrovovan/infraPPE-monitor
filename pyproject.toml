# pyproject.toml

[project]
name = "infraPPE-monitor"
version = "0.1.0"
description = "AI module for detecting PPE compliance from infrared video in low-visibility conditions"
requires-python = ">=3.11, <3.12"
readme = "README.md"
license = {text = "GNU GPLv3"}


dependencies = [
    #  ML
    "numpy>=1.26.4,<2.0",
    "torch>=2.1,<3.0",
    "ultralytics>=8.3.0,<9.0.0",
    "torchvision>=0.15.2,<0.20",
    "opencv-python>=4.5,<5.0",
    #  WEB
    "streamlit>=1.38,<2.0"
]

[project.optional-dependencies]
test = [
    "pytest"
]

